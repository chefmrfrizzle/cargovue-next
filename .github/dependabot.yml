version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      javascript-production:
        dependency-type: production
      javascript-development:
        dependency-type: development
  - package-ecosystem: pip
    directory: /apps/pce-service
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cargovue-pce"
version = "0.1.0"
description = "Fail-closed Physical Calculation Engine boundary for CargoVue Next."
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
